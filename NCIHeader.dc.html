<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./nci-data.js"></script>
</helmet>
<div>
<header data-screen-label="Header" style="position:fixed; top:clamp(12px,1.1vw,16px); left:clamp(12px,1.7vw,24px); right:clamp(12px,1.7vw,24px); z-index:50; height:clamp(56px,4.4vw,64px); display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 10px 0 clamp(16px,1.7vw,24px); border-radius:{{ hdr.radius }}; background:{{ hdr.bg }}; backdrop-filter:{{ hdr.blur }}; -webkit-backdrop-filter:{{ hdr.blur }}; box-shadow:{{ hdr.shadow }}; transition:background 300ms cubic-bezier(0.4,0,0.2,1), box-shadow 300ms cubic-bezier(0.4,0,0.2,1), border-radius 300ms cubic-bezier(0.4,0,0.2,1);">
  <a href="index.html" aria-label="Norte Chile Industrial — Inicio" style="display:flex; align-items:center; flex-shrink:1; min-width:0;">
    <img src="{{ hdr.logo }}" alt="Norte Chile Industrial" style="height:{{ sz.logo }}; width:auto; max-width:100%; object-fit:contain; object-position:left center; display:block;">
  </a>
  <sc-if value="{{ isDesktopNav }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex; align-items:center; gap:2px;">
      <a href="index.html" onMouseEnter="{{ closeMega }}" style="display:flex; align-items:center; gap:8px; height:44px; padding:12px 20px; border-radius:999px; color:{{ hdr.fg }}; font-size:16px; transition:background 150ms cubic-bezier(0.4,0,0.2,1);" style-hover="background:{{ hdr.hover }}; color:{{ hdr.fg }}">Inicio</a>
      <button type="button" onClick="{{ toggleMega }}" onMouseEnter="{{ openMega }}" aria-expanded="{{ megaOpen }}" style="display:flex; align-items:center; gap:8px; height:44px; padding:12px 20px; border:0; border-radius:999px; cursor:pointer; color:{{ hdr.fg }}; background:{{ hdr.catBg }}; font-size:16px; font-weight:{{ catNav.weight }}; transition:background 150ms cubic-bezier(0.4,0,0.2,1);" style-hover="background:{{ hdr.hover }}"><span style="display:{{ catNav.dot }}; width:5px; height:5px; border-radius:999px; background:#D71920;"></span>Catálogo<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform:{{ hdr.chev }}; transition:transform 300ms cubic-bezier(0.4,0,0.2,1);"><path d="M6 9l6 6 6-6"></path></svg></button>
      <sc-for list="{{ navs }}" as="n" hint-placeholder-count="3">
        <a href="{{ n.href }}" onMouseEnter="{{ closeMega }}" aria-current="{{ n.current }}" style="display:flex; align-items:center; gap:8px; height:44px; padding:12px 20px; border-radius:999px; color:{{ hdr.fg }}; background:{{ n.bg }}; font-size:16px; font-weight:{{ n.weight }}; transition:background 150ms cubic-bezier(0.4,0,0.2,1);" style-hover="background:{{ hdr.hover }}; color:{{ hdr.fg }}"><span style="display:{{ n.dot }}; width:5px; height:5px; border-radius:999px; background:#D71920;"></span>{{ n.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
  <div style="display:flex; align-items:center; gap:{{ sz.gap }}; flex-shrink:0;">
    <sc-if value="{{ searchInBar }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ openSearch }}" aria-label="Buscar productos" title="Buscar (/)" style="width:{{ sz.btn }}; height:{{ sz.btn }}; display:flex; align-items:center; justify-content:center; border:0; border-radius:999px; cursor:pointer; color:{{ hdr.fg }}; background:{{ hdr.burgerBg }}; transition:background 150ms cubic-bezier(0.4,0,0.2,1);" style-hover="background:{{ hdr.hover }}"><svg width="{{ sz.ico }}" height="{{ sz.ico }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button></sc-if>
    <button type="button" onClick="{{ openQuote }}" aria-label="Cotizar, {{ count }} productos en la lista" style="display:flex; align-items:center; gap:{{ sz.cGap }}; height:{{ sz.btn }}; padding:0 4px 0 {{ cotizarPad }}; border:0; cursor:pointer; border-radius:999px; background:#D71920; color:#FFFFFF; font-size:16px; font-weight:700; transition:background 150ms cubic-bezier(0.4,0,0.2,1);" style-hover="background:#B8141A; color:#FFFFFF">
      <svg width="{{ sz.ico2 }}" height="{{ sz.ico2 }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.5"></path></svg>
      <sc-if value="{{ isDesktopNav }}" hint-placeholder-val="{{ true }}"><span>Cotizar</span></sc-if>
      <span ref="{{ badgeRef }}" style="display:flex; align-items:center; justify-content:center; min-width:{{ sz.badge }}; height:{{ sz.badge }}; padding:0 6px; border-radius:999px; background:#FFFFFF; color:#D71920; font-size:{{ sz.badgeFs }}; font-weight:700; font-variant-numeric:tabular-nums;">{{ count }}</span>
    </button>
    <sc-if value="{{ isCompact }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ openDrawer }}" aria-label="Abrir menú" style="width:{{ sz.btn }}; height:{{ sz.btn }}; display:flex; align-items:center; justify-content:center; border:0; border-radius:999px; cursor:pointer; color:{{ hdr.fg }}; background:{{ hdr.burgerBg }}; backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);"><svg width="{{ sz.ico }}" height="{{ sz.ico }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h16M4 16h16"></path></svg></button>
    </sc-if>
  </div>
</header>

<sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}">
  <div ref="{{ toastRef }}" role="status" style="position:fixed; z-index:55; top:calc(clamp(12px,1.1vw,16px) + clamp(56px,4.4vw,64px) + 12px); right:clamp(12px,1.7vw,24px); max-width:min(420px, calc(100vw - 24px)); display:flex; align-items:center; gap:14px; padding:12px 12px 12px 14px; border-radius:16px; background:#0A1A44; color:#FFFFFF; box-shadow:0 24px 48px -16px rgba(6,15,43,0.5);">
    <span style="flex:none; width:36px; height:36px; border-radius:999px; background:#D71920; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
    <span style="flex:1; min-width:0; display:flex; flex-direction:column; font-size:14px; line-height:20px;"><strong style="font-weight:600;">{{ toast }}</strong><span style="color:rgba(255,255,255,0.75);">Agregado a tu lista de cotización</span></span>
    <a href="NCI%20Cotizacion.dc.html" onClick="{{ toastOpen }}" style="flex:none; display:inline-flex; align-items:center; height:40px; padding:0 16px; border-radius:999px; background:rgba(255,255,255,0.12); color:#FFFFFF; font-size:14px; font-weight:600;" style-hover="background:rgba(255,255,255,0.22); color:#FFFFFF">Ver lista</a>
  </div>
</sc-if>

<sc-if value="{{ megaOpen }}" hint-placeholder-val="{{ false }}">
  <div ref="{{ fadeRef }}" onClick="{{ closeMega }}" style="position:fixed; inset:0; z-index:40; background:rgba(10,26,68,0.10); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);"></div>
  <div ref="{{ panelRef }}" onMouseLeave="{{ closeMega }}" data-screen-label="Mega menú" style="position:fixed; top:80px; left:24px; right:24px; z-index:49; background:#F7F6F3; border-radius:0 0 32px 32px; box-shadow:0 48px 96px -24px rgba(6,15,43,0.35); padding:8px 32px 32px;">
    <div style="max-width:1344px; margin:0 auto; border-top:1px solid rgba(10,26,68,0.12); padding-top:28px; display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:48px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <sc-for list="{{ megaCards }}" as="m" hint-placeholder-count="2">
          <a href="NCI%20Catalogo.dc.html" onMouseEnter="{{ m.enter }}" onMouseLeave="{{ m.leave }}" style="position:relative; display:block; height:380px; border-radius:16px; overflow:hidden; background:#0A1A44; color:#FFFFFF;">
            <div style="position:absolute; inset:0; transform:{{ m.imgT }}; transition:transform 500ms cubic-bezier(0.22,1,0.36,1);"><img src="{{ m.src }}" alt="{{ m.name }}" style="position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:cover;"></div>
            <div style="position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(6,15,43,0) 40%, rgba(6,15,43,0.85) 100%);"></div>
            <span style="position:absolute; top:16px; right:16px; width:44px; height:44px; border-radius:999px; display:flex; align-items:center; justify-content:center; background:{{ m.btnBg }}; color:{{ m.btnFg }}; transition:background 150ms cubic-bezier(0.4,0,0.2,1), color 150ms;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform:{{ m.arrT }}; transition:transform 300ms cubic-bezier(0.4,0,0.2,1);"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
            <span style="position:absolute; left:24px; bottom:22px; pointer-events:none; font-family:'Saira',sans-serif; font-stretch:115%; font-weight:500; font-size:23px; line-height:36px; letter-spacing:-0.01em;">{{ m.name }}</span>
          </a>
        </sc-for>
      </div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <span style="font-size:13px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#646B7E; padding-left:8px;">Catálogo</span>
        <div style="display:grid; grid-template-columns:1fr 1fr; column-gap:16px; row-gap:2px;">
          <sc-for list="{{ megaItems }}" as="it" hint-placeholder-count="14">
            <a href="{{ it.href }}" onMouseEnter="{{ it.enter }}" onMouseLeave="{{ it.leave }}" style="display:flex; align-items:center; gap:14px; height:48px; padding:0 16px 0 8px; border-radius:999px; background:{{ it.bg }}; color:#0A1A44; font-size:16px; transition:background 150ms cubic-bezier(0.4,0,0.2,1);">
              <span style="width:32px; height:32px; border-radius:999px; background:#EEECE7; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><img src="{{ it.iconN }}" alt="" style="width:18px; height:18px;"></span>
              <span style="flex:1; min-width:0;">{{ it.name }}</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D71920" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{ it.arrO }}; transform:{{ it.arrT }}; transition:opacity 150ms cubic-bezier(0.4,0,0.2,1), transform 300ms cubic-bezier(0.4,0,0.2,1);"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </a>
          </sc-for>
          <a href="NCI%20Catalogo.dc.html" style="grid-column:1 / -1; display:flex; align-items:center; gap:14px; height:56px; margin-top:8px; padding:0 16px 0 8px; border-top:1px solid rgba(10,26,68,0.12); color:#0A1A44; font-size:16px; font-weight:600;" style-hover="color:#D71920">
            <span style="width:32px; height:32px; border-radius:999px; background:#D71920; color:#FFFFFF; display:flex; align-items:center; justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
            Ver catálogo completo
          </a>
        </div>
      </div>
    </div>
  </div>
</sc-if>

<div style="position:fixed; right:clamp(16px,1.7vw,24px); bottom:{{ waBottom }}; z-index:60; transition:bottom 400ms cubic-bezier(0.22,1,0.36,1);">
  <div ref="{{ waRef }}" style="position:relative; display:flex; align-items:center;">
    <span style="position:absolute; right:68px; white-space:nowrap; display:flex; align-items:center; height:40px; padding:0 18px; border-radius:999px; background:#0A1A44; color:#FFFFFF; font-size:14px; font-weight:500; box-shadow:0 8px 24px -8px rgba(6,15,43,0.4); opacity:{{ waTipO }}; transform:{{ waTipT }}; pointer-events:none; transition:opacity 150ms cubic-bezier(0.4,0,0.2,1), transform 300ms cubic-bezier(0.4,0,0.2,1);">WhatsApp</span>
    <a href="https://wa.me/" aria-label="WhatsApp" onMouseEnter="{{ waEnter }}" onMouseLeave="{{ waLeave }}" style="width:56px; height:56px; border-radius:999px; background:#25D366; color:#FFFFFF; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 28px -8px rgba(6,15,43,0.45), 0 2px 6px rgba(6,15,43,0.15); transition:background 150ms cubic-bezier(0.4,0,0.2,1);" style-hover="background:#1FBE5B; color:#FFFFFF"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.030-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89a11.82 11.82 0 0 0-3.48-8.41z"></path></svg></a>
  </div>
</div>

<sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ false }}">
  <div ref="{{ drawerRef }}" data-screen-label="Menú mobile" role="dialog" aria-label="Menú" style="position:fixed; inset:0; z-index:70; background:#F7F6F3; display:flex; flex-direction:column; overflow:hidden;">
    <div style="flex-shrink:0; height:76px; display:flex; align-items:center; justify-content:space-between; padding:0 12px 0 20px; border-bottom:1px solid rgba(10,26,68,0.12);">
      <img src="assets/logo-navy.png" alt="Norte Chile Industrial" style="height:22px; width:auto;">
      <button type="button" onClick="{{ closeDrawer }}" aria-label="Cerrar menú" style="width:48px; height:48px; border-radius:999px; border:0; background:rgba(10,26,68,0.06); color:#0A1A44; display:flex; align-items:center; justify-content:center; cursor:pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <nav style="flex:1; overflow-y:auto; padding:8px 20px 24px;">
      <button type="button" onClick="{{ openSearch }}" style="width:100%; display:flex; align-items:center; gap:12px; height:46px; margin:12px 0 8px; padding:0 18px; border-radius:999px; border:1px solid rgba(10,26,68,0.16); background:#FFFFFF; color:#646B7E; font-size:16px; text-align:left; cursor:pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A1A44" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Buscar productos…</button>
      <a href="index.html" style="display:flex; align-items:center; min-height:64px; border-bottom:1px solid rgba(10,26,68,0.12); font-family:'Saira',sans-serif; font-stretch:115%; font-weight:500; font-size:24px; letter-spacing:-0.02em; color:#0A1A44;">Inicio</a>
      <button type="button" onClick="{{ toggleAcc }}" aria-expanded="{{ accOpen }}" style="width:100%; display:flex; align-items:center; justify-content:space-between; min-height:64px; padding:0; border:0; background:transparent; cursor:pointer; font-family:'Saira',sans-serif; font-stretch:115%; font-weight:500; font-size:24px; letter-spacing:-0.02em; color:#0A1A44; border-bottom:{{ accBorder }};">Catálogo<span style="width:44px; height:44px; border-radius:999px; background:rgba(10,26,68,0.06); display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform:{{ accChev }}; transition:transform 300ms cubic-bezier(0.4,0,0.2,1);"><path d="M6 9l6 6 6-6"></path></svg></span></button>
      <sc-if value="{{ accOpen }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; flex-direction:column; padding:4px 0 16px; border-bottom:1px solid rgba(10,26,68,0.12);">
          <sc-for list="{{ megaItems }}" as="it" hint-placeholder-count="14">
            <a href="{{ it.href }}" onClick="{{ closeDrawer }}" style="display:flex; align-items:center; gap:14px; min-height:48px; color:#0A1A44; font-size:16px;">
              <span style="width:32px; height:32px; border-radius:999px; background:#EEECE7; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><img src="{{ it.iconN }}" alt="" style="width:18px; height:18px;"></span>{{ it.name }}
            </a>
          </sc-for>
          <a href="NCI%20Catalogo.dc.html" style="display:flex; align-items:center; gap:14px; min-height:46px; color:#0A1A44; font-size:16px; font-weight:600;"><span style="width:32px; height:32px; border-radius:999px; background:#D71920; color:#FFFFFF; display:flex; align-items:center; justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>Ver catálogo completo</a>
        </div>
      </sc-if>
      <sc-for list="{{ navs }}" as="n" hint-placeholder-count="3">
        <a href="{{ n.href }}" style="display:flex; align-items:center; gap:10px; min-height:64px; border-bottom:1px solid rgba(10,26,68,0.12); font-family:'Saira',sans-serif; font-stretch:115%; font-weight:500; font-size:24px; letter-spacing:-0.02em; color:#0A1A44;"><span style="display:{{ n.dot }}; width:6px; height:6px; border-radius:999px; background:#D71920;"></span>{{ n.label }}</a>
      </sc-for>
    </nav>
    <div style="flex-shrink:0; padding:16px 20px 24px; display:flex; flex-direction:column; gap:10px; background:#F7F6F3; border-top:1px solid rgba(10,26,68,0.12);">
      <a href="NCI%20Cotizacion.dc.html" style="display:flex; align-items:center; justify-content:center; gap:10px; height:46px; border-radius:999px; background:#D71920; color:#FFFFFF; font-size:16px; font-weight:700;">Cotizar <span style="display:flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 6px; border-radius:999px; background:#FFFFFF; color:#D71920; font-size:14px;">{{ count }}</span></a>
      <a href="https://wa.me/" style="display:flex; align-items:center; justify-content:center; gap:10px; height:46px; border-radius:999px; background:#25D366; color:#06301A; font-size:16px; font-weight:700;">WhatsApp</a>
    </div>
  </div>
</sc-if>
<dc-import name="NCISearch" open="{{ searchOpen }}" on-close="{{ closeSearch }}" hint-size="0px,0px"></dc-import>
<dc-import name="NCIQuoteDrawer" open="{{ quoteOpen }}" on-close="{{ closeQuote }}" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;catalogo&quot;,&quot;servicios&quot;,&quot;nosotros&quot;,&quot;contacto&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showMega&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showDrawer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;forceScrolled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    let q = {};
    try { const s = new URLSearchParams(location.search); q = { mega: s.get('mega') === '1', drawer: s.get('drawer') === '1' }; } catch (e) {}
    this.q = q;
    this.state = { w: window.innerWidth, scrolled: false, mega: null, drawer: null, acc: true, mh: -1, mc: -1, waTip: false, count: 0, toast: null, quote: false, search: false };
    const anim = (key, from) => el => { if (el && el !== this[key]) { this[key] = el; el.animate([{ opacity: 0, transform: from }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' }); } else if (!el) this[key] = null; };
    this.panelRef = anim('panelEl', 'translateY(-8px)');
    this.fadeRef = anim('fadeEl', 'none');
    this.drawerRef = anim('drawerEl', 'translateY(-8px)');
    this.toastRef = anim('toastEl', 'translateY(-8px)');
    this.badgeRef = el => { this.badge = el; };
