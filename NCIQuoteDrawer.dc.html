<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div ref="{{ fadeRef }}" onClick="{{ close }}" style="position:fixed; inset:0; z-index:80; background:rgba(10,26,68,0.28); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);"></div>
  <aside ref="{{ panelRef }}" role="dialog" aria-modal="true" aria-label="Tu lista de cotización" data-screen-label="Panel cotización" style="position:fixed; z-index:81; top:clamp(8px,1vw,12px); right:clamp(8px,1vw,12px); bottom:clamp(8px,1vw,12px); width:min(460px, calc(100vw - 16px)); display:flex; flex-direction:column; border-radius:24px; overflow:hidden; background:#F7F6F3; box-shadow:0 48px 96px -24px rgba(6,15,43,0.45); font-family:'Saira',system-ui,sans-serif;">
    <div style="flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 16px 16px 24px; border-bottom:1px solid rgba(10,26,68,0.10);">
      <div style="display:flex; flex-direction:column; gap:4px;">
        <span style="display:flex; align-items:center; gap:12px; font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#D71920;"><span style="width:24px; height:2px; background:#D71920;"></span>Cotización</span>
        <span style="font-stretch:115%; font-weight:500; font-size:24px; line-height:30px; color:#0A1A44;">Tu lista <span style="color:#646B7E; font-weight:400;">· {{ countLabel }}</span></span>
      </div>
      <button type="button" onClick="{{ close }}" aria-label="Cerrar" style="flex:none; width:44px; height:44px; border-radius:999px; border:0; background:rgba(10,26,68,0.06); color:#0A1A44; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background 150ms cubic-bezier(0.4,0,0.2,1);" style-hover="background:rgba(10,26,68,0.12)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1; min-height:0; overflow-y:auto; padding:8px 16px; display:flex; flex-direction:column; gap:8px;">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:14px; padding:12px; border-radius:16px; background:#FFFFFF; border:1px solid rgba(10,26,68,0.08);">
            <span style="flex:none; position:relative; width:64px; height:64px; border-radius:12px; overflow:hidden; background:#1F2430; display:flex; align-items:center; justify-content:center;">
              <sc-if value="{{ it.hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ it.img }}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(3px); transform:scale(1.15);"></sc-if>
              <sc-if value="{{ it.noImg }}" hint-placeholder-val="{{ false }}"><img src="{{ it.icon }}" alt="" style="width:26px; height:26px;"></sc-if>
            </span>
            <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
                <div style="min-width:0; display:flex; flex-direction:column;">
                  <span style="font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#646B7E;">{{ it.cat }}</span>
                  <span style="font-size:16px; line-height:21px; font-weight:500; color:#0A1A44; text-wrap:pretty;">{{ it.name }}</span>
                </div>
                <button type="button" onClick="{{ it.remove }}" aria-label="Quitar {{ it.name }}" style="flex:none; width:32px; height:32px; margin:-4px -4px 0 0; border-radius:999px; border:0; background:transparent; color:#646B7E; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background 150ms, color 150ms;" style-hover="background:rgba(215,25,32,0.08); color:#D71920"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
              </div>
              <div style="display:inline-flex; align-self:flex-start; align-items:center; height:36px; border-radius:999px; border:1px solid rgba(10,26,68,0.16); background:#FFFFFF;">
                <button type="button" onClick="{{ it.dec }}" aria-label="Restar" style="width:36px; height:34px; border:0; border-radius:999px; background:transparent; color:#0A1A44; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:{{ it.decO }};" style-hover="background:rgba(10,26,68,0.06)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
                <span style="min-width:32px; text-align:center; font-size:15px; font-weight:600; color:#0A1A44; font-variant-numeric:tabular-nums;">{{ it.qty }}</span>
                <button type="button" onClick="{{ it.inc }}" aria-label="Sumar" style="width:36px; height:34px; border:0; border-radius:999px; background:transparent; color:#0A1A44; display:flex; align-items:center; justify-content:center; cursor:pointer;" style-hover="background:rgba(10,26,68,0.06)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="flex:none; display:flex; flex-direction:column; gap:10px; padding:16px 16px 20px; border-top:1px solid rgba(10,26,68,0.10); background:#FFFFFF;">
        <div style="display:flex; justify-content:space-between; font-size:14px; color:#646B7E; padding:0 8px 4px;"><span>{{ countLabel }}</span><span>{{ unitsLabel }}</span></div>
        <a href="NCI%20Cotizacion.dc.html" style="display:flex; align-items:center; justify-content:center; gap:10px; height:46px; border-radius:999px; background:#D71920; color:#FFFFFF; font-size:16px; font-weight:700; transition:background 150ms cubic-bezier(0.4,0,0.2,1);" style-hover="background:#B8141A; color:#FFFFFF">Solicitar cotización<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        <button type="button" onClick="{{ close }}" style="height:48px; border-radius:999px; border:1px solid rgba(10,26,68,0.16); background:#FFFFFF; color:#0A1A44; font-size:15px; font-weight:500; cursor:pointer; transition:border-color 150ms;" style-hover="border-color:#0A1A44">Seguir navegando</button>
      </div>
    </sc-if>
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:32px; text-align:center;">
        <span style="width:72px; height:72px; border-radius:999px; background:#FFFFFF; border:1px solid rgba(10,26,68,0.10); color:#0A1A44; display:flex; align-items:center; justify-content:center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="2.5"></path></svg></span>
        <span style="font-stretch:115%; font-weight:500; font-size:20px; line-height:26px; color:#0A1A44;">Tu lista está vacía</span>
        <p style="margin:0; max-width:300px; font-size:15px; line-height:22px; color:#3B4256; text-wrap:pretty;">Agrega productos desde el catálogo y envíanos tu solicitud en un solo paso.</p>
        <a href="NCI%20Catalogo.dc.html" style="display:inline-flex; align-items:center; gap:10px; height:48px; padding:0 24px; border-radius:999px; background:#0A1A44; color:#FFFFFF; font-size:15px; font-weight:600;" style-hover="background:#060F2B; color:#FFFFFF">Ir al catálogo</a>
      </div>
    </sc-if>
  </aside>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { list: [] };
  panelRef = el => { if (el && el !== this.panel) { this.panel = el; el.animate([{ opacity: 0, transform: 'translateX(32px)' }, { opacity: 1, transform: 'none' }], { duration: 400, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'both' }); } else if (!el) this.panel = null; };
  fadeRef = el => { if (el && el !== this.fade) { this.fade = el; el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' }); } else if (!el) this.fade = null; };
  componentDidMount() {
    this.onQ = e => this.setState({ list: (e && e.detail && e.detail.list) || (window.NCI ? window.NCI.quote.get() : []) });
    this.onKey = e => { if (e.key === 'Escape' && this.props.open) this.close(); };
    this.onReady = () => this.onQ();
    window.addEventListener('nci-quote', this.onQ);
    window.addEventListener('keydown', this.onKey);
    if (window.NCI) this.onQ(); else window.addEventListener('nci-ready', this.onReady, { once: true });
  }
  componentDidUpdate(pp) {
    if (this.props.open && !pp.open) { this.onQ(); document.documentElement.style.overflow = 'hidden'; }
    if (!this.props.open && pp.open) document.documentElement.style.overflow = '';
  }
  componentWillUnmount() { window.removeEventListener('nci-quote', this.onQ); window.removeEventListener('keydown', this.onKey); window.removeEventListener('nci-ready', this.onReady); document.documentElement.style.overflow = ''; }
  close() { this.props.onClose && this.props.onClose(); }
  renderVals() {
    const N = window.NCI, list = this.state.list;
    const items = list.map(it => ({
      ...it, hasImg: !!it.img, noImg: !it.img, icon: N ? N.ico(it.catKey, '#FFFFFF') : '',
      decO: it.qty > 1 ? 1 : 0.35,
      dec: () => N.quote.set(it.id, it.qty - 1), inc: () => N.quote.set(it.id, it.qty + 1), remove: () => N.quote.remove(it.id)
    }));
    const units = list.reduce((a, i) => a + (i.qty || 0), 0);
    return {
      open: !!this.props.open, close: () => this.close(), panelRef: this.panelRef, fadeRef: this.fadeRef,
      items, hasItems: list.length > 0, isEmpty: list.length === 0,
      countLabel: list.length + (list.length === 1 ? ' producto' : ' productos'),
      unitsLabel: units + (units === 1 ? ' unidad' : ' unidades')
    };
  }
}
</script>
</body>
</html>
